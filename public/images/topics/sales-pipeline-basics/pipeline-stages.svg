<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="t">
  <title id="t">見込み客の段階と、段階ごとの次の一手</title>
  <style>
    text { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #16334d; }
    .h { font-size: 30px; font-weight: 700; }
    .lb { font-size: 26px; font-weight: 700; }
    .tx { font-size: 26px; }
    .gl { font-size: 26px; font-weight: 700; fill: #4a667d; }
    .num { font-size: 24px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect width="600" height="700" fill="#fbfdff"/>
  <text class="h" x="300" y="50" text-anchor="middle">段階ごとに次の一手を決める</text>
  <text class="gl" x="20" y="102">段階</text>
  <text class="gl" x="280" y="102">次の一手</text>
  <rect x="20" y="116" width="240" height="76" rx="12" fill="#eef6fc" stroke="#d8e7f2" stroke-width="2"/>
  <circle cx="50" cy="154" r="18" fill="#087fe5"/>
  <text class="num" x="50" y="162" text-anchor="middle">1</text>
  <text class="lb" x="80" y="163">接点あり</text>
  <polygon points="264,144 276,154 264,164" fill="#087fe5"/>
  <rect x="280" y="116" width="300" height="76" rx="12" fill="#ffffff" stroke="#087fe5" stroke-width="2"/>
  <text class="tx" x="296" y="163">お礼と情報を送る</text>
  <polygon points="128,198 152,198 140,210" fill="#4a667d"/>
  <rect x="20" y="216" width="240" height="76" rx="12" fill="#eef6fc" stroke="#d8e7f2" stroke-width="2"/>
  <circle cx="50" cy="254" r="18" fill="#087fe5"/>
  <text class="num" x="50" y="262" text-anchor="middle">2</text>
  <text class="lb" x="80" y="263">関心あり</text>
  <polygon points="264,244 276,254 264,264" fill="#087fe5"/>
  <rect x="280" y="216" width="300" height="76" rx="12" fill="#ffffff" stroke="#087fe5" stroke-width="2"/>
  <text class="tx" x="296" y="263">短い面談を提案</text>
  <polygon points="128,298 152,298 140,310" fill="#4a667d"/>
  <rect x="20" y="316" width="240" height="76" rx="12" fill="#eef6fc" stroke="#d8e7f2" stroke-width="2"/>
  <circle cx="50" cy="354" r="18" fill="#087fe5"/>
  <text class="num" x="50" y="362" text-anchor="middle">3</text>
  <text class="lb" x="80" y="363">検討中</text>
  <polygon points="264,344 276,354 264,364" fill="#087fe5"/>
  <rect x="280" y="316" width="300" height="76" rx="12" fill="#ffffff" stroke="#087fe5" stroke-width="2"/>
  <text class="tx" x="296" y="363">課題に合う提案を準備</text>
  <polygon points="128,398 152,398 140,410" fill="#4a667d"/>
  <rect x="20" y="416" width="240" height="76" rx="12" fill="#eef6fc" stroke="#d8e7f2" stroke-width="2"/>
  <circle cx="50" cy="454" r="18" fill="#087fe5"/>
  <text class="num" x="50" y="462" text-anchor="middle">4</text>
  <text class="lb" x="80" y="463">提案済み</text>
  <polygon points="264,444 276,454 264,464" fill="#087fe5"/>
  <rect x="280" y="416" width="300" height="76" rx="12" fill="#ffffff" stroke="#087fe5" stroke-width="2"/>
  <text class="tx" x="296" y="463">1週間後に確認の連絡</text>
  <polygon points="128,498 152,498 140,510" fill="#4a667d"/>
  <rect x="20" y="516" width="240" height="76" rx="12" fill="#eef6fc" stroke="#d8e7f2" stroke-width="2"/>
  <circle cx="50" cy="554" r="18" fill="#087fe5"/>
  <text class="num" x="50" y="562" text-anchor="middle">5</text>
  <text class="lb" x="80" y="563">受注／見送り</text>
  <polygon points="264,544 276,554 264,564" fill="#087fe5"/>
  <rect x="280" y="516" width="300" height="76" rx="12" fill="#ffffff" stroke="#087fe5" stroke-width="2"/>
  <text class="tx" x="296" y="563">結果と理由を記録</text>
  <rect x="20" y="616" width="560" height="64" rx="14" fill="#16334d"/>
  <text x="300" y="658" text-anchor="middle" style="fill:#ffffff;font-size:26px;font-weight:700">迷う時間がなくなり、続けやすい</text>
</svg>
