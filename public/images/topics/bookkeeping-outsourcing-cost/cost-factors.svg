<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" role="img" aria-labelledby="t">
  <title id="t">経理代行の費用を決める4つの要素</title>
  <style>
    text { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #16334d; }
    .h { font-size: 30px; font-weight: 700; }
    .lb { font-size: 28px; font-weight: 700; }
    .tx { font-size: 26px; fill: #4a667d; }
    .gl { font-size: 26px; font-weight: 700; }
  </style>
  <rect width="600" height="680" fill="#fbfdff"/>
  <text class="h" x="300" y="50" text-anchor="middle">費用を決める4つの要素</text>

  <text class="gl" x="20" y="106" style="fill:#4a667d">事業の規模で決まる</text>
  <rect x="20" y="122" width="270" height="150" rx="14" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <text class="lb" x="40" y="168">取引の量</text>
  <text class="tx" x="40" y="212">月の仕訳数</text>
  <text class="tx" x="40" y="248">請求書などの枚数</text>
  <rect x="310" y="122" width="270" height="150" rx="14" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <text class="lb" x="330" y="168">頻度と期限</text>
  <text class="tx" x="330" y="212">毎週か月1回か</text>
  <text class="tx" x="330" y="248">数字を見たい日</text>

  <rect x="8" y="294" width="584" height="252" rx="18" fill="#fff7df" stroke="#ffd85a" stroke-width="3"/>
  <rect x="20" y="312" width="240" height="44" rx="22" fill="#ffd85a"/>
  <text class="gl" x="140" y="343" text-anchor="middle">工夫で変えやすい</text>
  <rect x="20" y="374" width="270" height="150" rx="14" fill="#ffffff" stroke="#087fe5" stroke-width="3"/>
  <text class="lb" x="40" y="420">業務の範囲</text>
  <text class="tx" x="40" y="464">記帳だけか</text>
  <text class="tx" x="40" y="500">締めまでか</text>
  <rect x="310" y="374" width="270" height="150" rx="14" fill="#ffffff" stroke="#087fe5" stroke-width="3"/>
  <text class="lb" x="330" y="420">資料の状態</text>
  <text class="tx" x="330" y="464">データで届くか</text>
  <text class="tx" x="330" y="500">紙の整理からか</text>

  <polygon points="276,558 324,558 300,582" fill="#087fe5"/>
  <rect x="20" y="594" width="560" height="68" rx="14" fill="#16334d"/>
  <text x="300" y="638" text-anchor="middle" style="fill:#ffffff;font-size:26px;font-weight:700">4つの組み合わせで見積もりが決まる</text>
</svg>
