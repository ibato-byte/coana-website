<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="t">
  <title id="t">口コミでしてよいことと、避けること</title>
  <style>
    text { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #16334d; }
    .h { font-size: 30px; font-weight: 700; }
    .lb { font-size: 28px; font-weight: 700; }
    .b { font-size: 26px; font-weight: 700; }
    .tx { font-size: 26px; fill: #4a667d; }
    .c { font-size: 26px; }
    .ac { font-size: 26px; font-weight: 700; fill: #087fe5; }
    .hd { font-size: 26px; font-weight: 700; fill: #ffffff; }
    .num { font-size: 26px; font-weight: 700; fill: #ffffff; }
    .tag { font-size: 24px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect width="600" height="520" fill="#fbfdff"/>
  <text class="h" x="300" y="50" text-anchor="middle">口コミでしてよいこと・避けること</text>
  <rect x="14" y="80" width="280" height="56" rx="12" fill="#087fe5"/>
  <text class="hd" x="154" y="117" text-anchor="middle">してよいこと</text>
  <rect x="306" y="80" width="280" height="56" rx="12" fill="#16334d"/>
  <text class="hd" x="446" y="117" text-anchor="middle">避けること</text>
  <rect x="14" y="144" width="280" height="78" rx="8" fill="#eef6fc"/>
  <polyline points="28,184 36,192 50,176" fill="none" stroke="#087fe5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="c" x="60" y="192">利用客に依頼する</text>
  <rect x="306" y="144" width="280" height="78" rx="8" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <path d="M322 175 L338 191 M338 175 L322 191" stroke="#16334d" stroke-width="4" stroke-linecap="round"/>
  <text class="c" x="350" y="192">謝礼と交換で依頼</text>
  <rect x="14" y="230" width="280" height="78" rx="8" fill="#eef6fc"/>
  <polyline points="28,270 36,278 50,262" fill="none" stroke="#087fe5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="c" x="60" y="278">具体的に返信する</text>
  <rect x="306" y="230" width="280" height="78" rx="8" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <path d="M322 261 L338 277 M338 261 L322 277" stroke="#16334d" stroke-width="4" stroke-linecap="round"/>
  <text class="c" x="350" y="278">関係者が客を装う</text>
  <rect x="14" y="316" width="280" height="78" rx="8" fill="#eef6fc"/>
  <polyline points="28,356 36,364 50,348" fill="none" stroke="#087fe5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="c" x="60" y="364">厳しい声も丁寧に</text>
  <rect x="306" y="316" width="280" height="78" rx="8" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <path d="M322 347 L338 363 M338 347 L322 363" stroke="#16334d" stroke-width="4" stroke-linecap="round"/>
  <text class="c" x="350" y="364">定型文だけで返信</text>
  <rect x="14" y="420" width="572" height="80" rx="14" fill="#fff7df" stroke="#ffd85a" stroke-width="3"/>
  <text class="b" x="300" y="469" text-anchor="middle">迷ったら公式のポリシーを確認</text>
</svg>
