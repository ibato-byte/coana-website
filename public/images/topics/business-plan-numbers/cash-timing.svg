<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" role="img" aria-labelledby="t">
  <title id="t">売上と入金の時期はずれる</title>
  <style>
    text { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #16334d; }
    .h { font-size: 30px; font-weight: 700; }
    .tag { font-size: 24px; font-weight: 700; fill: #ffffff; }
    .pt { font-size: 26px; font-weight: 700; }
    .bx { font-size: 26px; fill: #4a667d; }
    .rs { font-size: 26px; font-weight: 700; }
  </style>
  <rect width="600" height="650" fill="#fbfdff"/>
  <text class="h" x="300" y="50" text-anchor="middle">売上と入金の時期はずれる</text>

  <rect x="8" y="78" width="584" height="220" rx="18" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <rect x="20" y="96" width="132" height="42" rx="21" fill="#4a667d"/>
  <text class="tag" x="86" y="126" text-anchor="middle">1か月目</text>
  <rect x="20" y="156" width="270" height="124" rx="12" fill="#eef6fc" stroke="#d8e7f2" stroke-width="2"/>
  <text class="pt" x="155" y="206" text-anchor="middle">売上が立つ</text>
  <text class="bx" x="155" y="246" text-anchor="middle">入金は翌月</text>
  <rect x="310" y="156" width="270" height="124" rx="12" fill="#eef6fc" stroke="#d8e7f2" stroke-width="2"/>
  <text class="pt" x="445" y="206" text-anchor="middle">支払いが先</text>
  <text class="bx" x="445" y="246" text-anchor="middle">仕入れ・家賃</text>

  <polygon points="276,310 324,310 300,336" fill="#087fe5"/>

  <rect x="8" y="348" width="584" height="160" rx="18" fill="#eef6fc" stroke="#087fe5" stroke-width="3"/>
  <rect x="20" y="366" width="132" height="42" rx="21" fill="#087fe5"/>
  <text class="tag" x="86" y="396" text-anchor="middle">2か月目</text>
  <rect x="20" y="424" width="560" height="64" rx="12" fill="#ffffff" stroke="#55b8f3" stroke-width="2"/>
  <text class="pt" x="300" y="466" text-anchor="middle">前月の売上が入金される</text>

  <rect x="8" y="526" width="584" height="108" rx="14" fill="#fff7df" stroke="#ffd85a" stroke-width="3"/>
  <text class="rs" x="300" y="568" text-anchor="middle">ずれの分のお金を用意する</text>
  <text class="bx" x="300" y="608" text-anchor="middle" style="fill:#16334d">資金繰り表で残高を確認</text>
</svg>
