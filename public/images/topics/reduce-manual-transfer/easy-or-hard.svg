<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 534" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif">
  <rect width="600" height="534" fill="#fbfdff"/>
  <text x="300" y="44" font-size="28" font-weight="700" fill="#16334d" text-anchor="middle">自動にしやすい・しにくい転記</text>
  <rect x="24" y="80" width="264" height="424" rx="14" fill="#ffffff" stroke="#087fe5" stroke-width="3"/>
  <text x="156" y="124" font-size="26" font-weight="700" text-anchor="middle" fill="#087fe5">しやすい</text>
  <path d="M48 144 H264" stroke="#d8e7f2" stroke-width="2"/>
  <circle cx="54" cy="182" r="6" fill="#087fe5"/>
  <text x="70" y="190" font-size="26" fill="#16334d">毎回同じ</text>
  <text x="70" y="224" font-size="26" fill="#16334d">項目を写す</text>
  <circle cx="54" cy="302" r="6" fill="#087fe5"/>
  <text x="70" y="310" font-size="26" fill="#16334d">入力の形が</text>
  <text x="70" y="344" font-size="26" fill="#16334d">決まっている</text>
  <circle cx="54" cy="422" r="6" fill="#087fe5"/>
  <text x="70" y="430" font-size="26" fill="#16334d">ルールで</text>
  <text x="70" y="464" font-size="26" fill="#16334d">決まる処理</text>
  <rect x="312" y="80" width="264" height="424" rx="14" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <text x="444" y="124" font-size="26" font-weight="700" text-anchor="middle" fill="#16334d">しにくい</text>
  <path d="M336 144 H552" stroke="#d8e7f2" stroke-width="2"/>
  <circle cx="342" cy="182" r="6" fill="#4a667d"/>
  <text x="358" y="190" font-size="26" fill="#16334d">毎回判断が</text>
  <text x="358" y="224" font-size="26" fill="#16334d">要る</text>
  <circle cx="342" cy="302" r="6" fill="#4a667d"/>
  <text x="358" y="310" font-size="26" fill="#16334d">元の資料が</text>
  <text x="358" y="344" font-size="26" fill="#16334d">紙でばらばら</text>
  <circle cx="342" cy="422" r="6" fill="#4a667d"/>
  <text x="358" y="430" font-size="26" fill="#16334d">例外が</text>
  <text x="358" y="464" font-size="26" fill="#16334d">多い</text>
</svg>
