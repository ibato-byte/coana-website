<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="t">
  <title id="t">手順でできる作業と、判断が必要な作業</title>
  <style>
    text { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #16334d; }
    .h { font-size: 30px; font-weight: 700; }
    .hd { font-size: 26px; font-weight: 700; fill: #ffffff; }
    .c { font-size: 26px; }
    .n { font-size: 26px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect width="600" height="520" fill="#fbfdff"/>
  <text class="h" x="300" y="50" text-anchor="middle">判断と手順を分ける</text>

  <rect x="14" y="80" width="280" height="56" rx="12" fill="#087fe5"/>
  <text class="hd" x="154" y="117" text-anchor="middle">手順でできる</text>
  <rect x="306" y="80" width="280" height="56" rx="12" fill="#16334d"/>
  <text class="hd" x="446" y="117" text-anchor="middle">判断が必要</text>

  <g fill="#eef6fc">
    <rect x="14" y="144" width="280" height="60" rx="8"/>
    <rect x="14" y="210" width="280" height="60" rx="8"/>
    <rect x="14" y="276" width="280" height="60" rx="8"/>
    <rect x="14" y="342" width="280" height="60" rx="8"/>
  </g>
  <g fill="#ffffff" stroke="#d8e7f2" stroke-width="2">
    <rect x="306" y="144" width="280" height="60" rx="8"/>
    <rect x="306" y="210" width="280" height="60" rx="8"/>
    <rect x="306" y="276" width="280" height="60" rx="8"/>
    <rect x="306" y="342" width="280" height="60" rx="8"/>
  </g>
  <g fill="#087fe5">
    <circle cx="28" cy="174" r="5"/><circle cx="28" cy="240" r="5"/><circle cx="28" cy="306" r="5"/><circle cx="28" cy="372" r="5"/>
  </g>
  <g fill="#16334d">
    <circle cx="324" cy="174" r="5"/><circle cx="324" cy="240" r="5"/><circle cx="324" cy="306" r="5"/><circle cx="324" cy="372" r="5"/>
  </g>
  <text class="c" x="42" y="184">請求書を作る・送る</text>
  <text class="c" x="42" y="250">振込データを作る</text>
  <text class="c" x="42" y="316">領収書を入力する</text>
  <text class="c" x="42" y="382">入金を確認する</text>
  <text class="c" x="340" y="184">請求額を決める</text>
  <text class="c" x="340" y="250">支払いを承認する</text>
  <text class="c" x="340" y="316">経費の可否を判断</text>
  <text class="c" x="340" y="382">取引先を選ぶ</text>

  <rect x="14" y="428" width="572" height="70" rx="14" fill="#16334d"/>
  <text class="n" x="300" y="472" text-anchor="middle">手順は任せ、判断は担当者を決める</text>
</svg>
