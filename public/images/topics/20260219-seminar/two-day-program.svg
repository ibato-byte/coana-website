<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 696" role="img" aria-labelledby="t">
  <title id="t">2日間の研修の流れ</title>
  <style>
    text { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #16334d; }
    .h { font-size: 30px; font-weight: 700; }
    .lb { font-size: 28px; font-weight: 700; }
    .tx { font-size: 26px; fill: #4a667d; }
    .pill { font-size: 26px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect width="600" height="696" fill="#fbfdff"/>
  <text class="h" x="300" y="50" text-anchor="middle">2日間の研修の流れ</text>

  <rect x="20" y="86" width="560" height="176" rx="14" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <rect x="40" y="106" width="116" height="44" rx="22" fill="#16334d"/>
  <text class="pill" x="98" y="137" text-anchor="middle">1日目</text>
  <text class="lb" x="176" y="138">全体像と基本を整理</text>
  <circle cx="52" cy="187" r="6" fill="#087fe5"/>
  <text class="tx" x="68" y="196">経理・税金の全体像</text>
  <circle cx="52" cy="229" r="6" fill="#087fe5"/>
  <text class="tx" x="68" y="238">DX・クラウド会計の基本</text>

  <polygon points="276,274 324,274 300,298" fill="#087fe5"/>

  <rect x="20" y="310" width="560" height="250" rx="14" fill="#ffffff" stroke="#087fe5" stroke-width="3"/>
  <rect x="40" y="330" width="116" height="44" rx="22" fill="#087fe5"/>
  <text class="pill" x="98" y="361" text-anchor="middle">2日目</text>
  <text class="lb" x="176" y="362">freeeで実践演習</text>
  <circle cx="52" cy="407" r="6" fill="#087fe5"/>
  <text class="tx" x="68" y="416">初期設定</text>
  <circle cx="52" cy="447" r="6" fill="#087fe5"/>
  <text class="tx" x="68" y="456">明細の取込み</text>
  <circle cx="52" cy="487" r="6" fill="#087fe5"/>
  <text class="tx" x="68" y="496">見積書・請求書の発行</text>
  <circle cx="52" cy="527" r="6" fill="#087fe5"/>
  <text class="tx" x="68" y="536">自動登録ルールの活用</text>

  <polygon points="276,572 324,572 300,596" fill="#087fe5"/>
  <rect x="20" y="608" width="560" height="68" rx="14" fill="#16334d"/>
  <text x="300" y="652" text-anchor="middle" style="fill:#ffffff;font-size:26px;font-weight:700">ご自身の業務への落とし込み</text>
</svg>
