<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" role="img" aria-labelledby="t">
  <title id="t">開催後のフォローの流れ</title>
  <style>
    text { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #16334d; }
    .h { font-size: 30px; font-weight: 700; }
    .lb { font-size: 28px; font-weight: 700; }
    .b { font-size: 26px; font-weight: 700; }
    .tx { font-size: 26px; fill: #4a667d; }
    .num { font-size: 26px; font-weight: 700; fill: #ffffff; }
    .tag { font-size: 24px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect width="600" height="620" fill="#fbfdff"/>
  <text class="h" x="300" y="50" text-anchor="middle">開催後のフォローの流れ</text>
  <line x1="90" y1="120" x2="90" y2="430" stroke="#55b8f3" stroke-width="4"/>
  <rect x="20" y="100" width="140" height="48" rx="24" fill="#4a667d"/>
  <text class="tag" x="90" y="132" text-anchor="middle">当日</text>
  <rect x="176" y="84" width="404" height="80" rx="12" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <text x="194" y="134" style="font-size:26px">アンケートで相談希望を聞く</text>
  <rect x="20" y="200" width="140" height="48" rx="24" fill="#087fe5"/>
  <text class="tag" x="90" y="232" text-anchor="middle">翌日まで</text>
  <rect x="176" y="184" width="404" height="80" rx="12" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <text x="194" y="234" style="font-size:26px">お礼と資料を送る</text>
  <rect x="20" y="300" width="140" height="48" rx="24" fill="#087fe5"/>
  <text class="tag" x="90" y="332" text-anchor="middle">希望者に</text>
  <rect x="176" y="284" width="404" height="80" rx="12" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <text x="194" y="334" style="font-size:26px">個別の面談を提案</text>
  <rect x="20" y="400" width="140" height="48" rx="24" fill="#087fe5"/>
  <text class="tag" x="90" y="432" text-anchor="middle">その後</text>
  <rect x="176" y="384" width="404" height="80" rx="12" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <text x="194" y="434" style="font-size:26px">次回の案内を定期的に</text>
  <polygon points="276,488 324,488 300,512" fill="#087fe5"/>
  <rect x="20" y="522" width="560" height="80" rx="14" fill="#eef6fc" stroke="#087fe5" stroke-width="3"/>
  <text class="b" x="300" y="572" text-anchor="middle">見込み客の一覧に登録する</text>
</svg>
