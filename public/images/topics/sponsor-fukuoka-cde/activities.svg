<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 572" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif">
  <rect width="600" height="572" rx="16" fill="#fbfdff"/>
  <text x="300" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#16334d">発教研の3つの事業</text>
  <g>
    <rect x="24" y="80" width="552" height="146" rx="14" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
    <rect x="24" y="80" width="10" height="146" rx="5" fill="#087fe5"/>
    <circle cx="80" cy="126" r="24" fill="#087fe5"/>
    <text x="80" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">1</text>
    <text x="120" y="135" font-size="26" font-weight="700" fill="#16334d">子育て支援・地域交流</text>
    <text x="120" y="178" font-size="24" fill="#4a667d">親子教室・フリースクール</text>
    <text x="120" y="210" font-size="24" fill="#4a667d">野外教室・地域イベント</text>
  </g>
  <g>
    <rect x="24" y="244" width="552" height="146" rx="14" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
    <rect x="24" y="244" width="10" height="146" rx="5" fill="#087fe5"/>
    <circle cx="80" cy="290" r="24" fill="#087fe5"/>
    <text x="80" y="299" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">2</text>
    <text x="120" y="299" font-size="26" font-weight="700" fill="#16334d">地域連携・啓発</text>
    <text x="120" y="342" font-size="24" fill="#4a667d">園や施設への訪問・相談</text>
    <text x="120" y="374" font-size="24" fill="#4a667d">研修・講演・保護者の学習会</text>
  </g>
  <g>
    <rect x="24" y="408" width="552" height="146" rx="14" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
    <rect x="24" y="408" width="10" height="146" rx="5" fill="#087fe5"/>
    <circle cx="80" cy="454" r="24" fill="#087fe5"/>
    <text x="80" y="463" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">3</text>
    <text x="120" y="463" font-size="26" font-weight="700" fill="#16334d">幼児発達の調査・研究</text>
    <text x="120" y="506" font-size="24" fill="#4a667d">アンケート・データ分析</text>
    <text x="120" y="538" font-size="24" fill="#4a667d">論文・研究発表</text>
  </g>
