<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 712" role="img" aria-labelledby="t">
  <title id="t">クラウド会計の導入前に整理する5つのこと</title>
  <style>
    text { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #16334d; }
    .h { font-size: 30px; font-weight: 700; }
    .num { font-size: 26px; font-weight: 700; fill: #ffffff; }
    .lb { font-size: 26px; font-weight: 700; }
    .tx { font-size: 26px; fill: #4a667d; }
  </style>
  <rect width="600" height="712" fill="#fbfdff"/>
  <text class="h" x="300" y="50" text-anchor="middle">導入前に整理する5つのこと</text>

  <g fill="#ffffff" stroke="#d8e7f2" stroke-width="2">
    <rect x="20" y="80" width="560" height="92" rx="14"/>
    <rect x="20" y="182" width="560" height="92" rx="14"/>
    <rect x="20" y="284" width="560" height="92" rx="14"/>
    <rect x="20" y="386" width="560" height="92" rx="14"/>
    <rect x="20" y="488" width="560" height="92" rx="14"/>
  </g>
  <g fill="#087fe5">
    <circle cx="66" cy="126" r="26"/>
    <circle cx="66" cy="228" r="26"/>
    <circle cx="66" cy="330" r="26"/>
    <circle cx="66" cy="432" r="26"/>
    <circle cx="66" cy="534" r="26"/>
  </g>
  <text class="num" x="66" y="135" text-anchor="middle">1</text>
  <text class="num" x="66" y="237" text-anchor="middle">2</text>
  <text class="num" x="66" y="339" text-anchor="middle">3</text>
  <text class="num" x="66" y="441" text-anchor="middle">4</text>
  <text class="num" x="66" y="543" text-anchor="middle">5</text>

  <text class="lb" x="112" y="118">お金の流れを書き出す</text>
  <text class="tx" x="112" y="154">誰が・いつ・何を</text>
  <text class="lb" x="112" y="220">口座とカードを分ける</text>
  <text class="tx" x="112" y="256">事業用だけを連携</text>
  <text class="lb" x="112" y="322">科目は判断に使う粒度</text>
  <text class="tx" x="112" y="358">細かすぎず粗すぎず</text>
  <text class="lb" x="112" y="424">証憑の集め方を決める</text>
  <text class="tx" x="112" y="460">紙もデータも置き場所を</text>
  <text class="lb" x="112" y="526">切り替えは期首か月初</text>
  <text class="tx" x="112" y="562">二重入力の期間を短く</text>

  <polygon points="276,594 324,594 300,618" fill="#087fe5"/>
  <rect x="20" y="630" width="560" height="64" rx="14" fill="#16334d"/>
  <text x="300" y="672" text-anchor="middle" style="fill:#ffffff;font-size:26px;font-weight:700">整理してからソフトを選ぶ</text>
</svg>
