<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="t">
  <title id="t">講演でお話しした内容の流れ</title>
  <style>
    text { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #16334d; }
    .h { font-size: 30px; font-weight: 700; }
    .lb { font-size: 28px; font-weight: 700; }
    .num { font-size: 26px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect width="600" height="600" fill="#fbfdff"/>
  <text class="h" x="300" y="50" text-anchor="middle">講演でお話しした内容の流れ</text>
  <rect x="20" y="78" width="560" height="74" rx="14" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <circle cx="66" cy="115" r="22" fill="#16334d"/>
  <text class="num" x="66" y="124" text-anchor="middle">1</text>
  <text class="lb" x="106" y="125">経理の現状と課題</text>
  <rect x="20" y="164" width="560" height="74" rx="14" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <circle cx="66" cy="201" r="22" fill="#16334d"/>
  <text class="num" x="66" y="210" text-anchor="middle">2</text>
  <text class="lb" x="106" y="211">改善の手法と手順</text>
  <rect x="20" y="250" width="560" height="74" rx="14" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <circle cx="66" cy="287" r="22" fill="#16334d"/>
  <text class="num" x="66" y="296" text-anchor="middle">3</text>
  <text class="lb" x="106" y="297">クラウド会計の導入</text>
  <rect x="20" y="336" width="560" height="74" rx="14" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <circle cx="66" cy="373" r="22" fill="#16334d"/>
  <text class="num" x="66" y="382" text-anchor="middle">4</text>
  <text class="lb" x="106" y="383">税理士との役割分担</text>

  <polygon points="276,426 324,426 300,450" fill="#087fe5"/>
  <rect x="20" y="462" width="560" height="118" rx="14" fill="#fff7df" stroke="#ffd85a" stroke-width="3"/>
  <circle cx="66" cy="521" r="22" fill="#087fe5"/>
  <text class="num" x="66" y="530" text-anchor="middle">5</text>
  <text class="lb" x="106" y="512">リアルタイムな数値で</text>
  <text class="lb" x="106" y="554">「攻め」の経営を可能に</text>
</svg>
