<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 570" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif">
  <rect width="600" height="570" fill="#fbfdff"/>
  <text x="300" y="48" font-size="28" font-weight="700" fill="#16334d" text-anchor="middle">任せやすい作業と、残す判断</text>
  <g font-size="24" fill="#16334d">
    <rect x="24" y="80" width="264" height="390" rx="14" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
    <text x="156" y="124" font-size="26" font-weight="700" text-anchor="middle" fill="#16334d">任せやすい作業</text>
    <path d="M48 144 H264" stroke="#d8e7f2" stroke-width="2"/>
    <circle cx="54" cy="182" r="6" fill="#4a667d"/>
    <text x="70" y="190">ソフトへの入力</text>
    <circle cx="54" cy="242" r="6" fill="#4a667d"/>
    <text x="70" y="250">請求書の発行</text>
    <circle cx="54" cy="302" r="6" fill="#4a667d"/>
    <text x="70" y="310">入金の確認</text>
    <circle cx="54" cy="362" r="6" fill="#4a667d"/>
    <text x="70" y="370">振込データの作成</text>
    <circle cx="54" cy="422" r="6" fill="#4a667d"/>
    <text x="70" y="430">月の締め</text>
    <rect x="312" y="80" width="264" height="390" rx="14" fill="#ffffff" stroke="#087fe5" stroke-width="3"/>
    <text x="444" y="124" font-size="26" font-weight="700" text-anchor="middle" fill="#087fe5">自社に残す判断</text>
    <path d="M336 144 H552" stroke="#d8e7f2" stroke-width="2"/>
    <circle cx="342" cy="182" r="6" fill="#087fe5"/>
    <text x="358" y="190">支払いの承認</text>
    <circle cx="342" cy="242" r="6" fill="#087fe5"/>
    <text x="358" y="250">値段や条件決め</text>
    <circle cx="342" cy="302" r="6" fill="#087fe5"/>
    <text x="358" y="310">取引先との交渉</text>
    <circle cx="342" cy="362" r="6" fill="#087fe5"/>
    <text x="358" y="370">経費と認めるか</text>
  </g>
  <rect x="24" y="490" width="552" height="56" rx="12" fill="#fff7df" stroke="#ffd85a" stroke-width="2"/>
  <text x="300" y="527" font-size="26" font-weight="700" fill="#16334d" text-anchor="middle">作業は任せても、最後に決めるのは会社</text>
</svg>
