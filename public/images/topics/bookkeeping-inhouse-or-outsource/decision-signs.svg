<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 534" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif">
  <rect width="600" height="534" fill="#fbfdff"/>
  <text x="300" y="48" font-size="28" font-weight="700" fill="#16334d" text-anchor="middle">自社で続けるか、任せるかの目安</text>
  <g font-size="24" fill="#16334d">
    <rect x="24" y="80" width="264" height="424" rx="14" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
    <text x="156" y="124" font-size="26" font-weight="700" text-anchor="middle" fill="#16334d">自社で続けやすい</text>
    <path d="M48 144 H264" stroke="#d8e7f2" stroke-width="2"/>
    <circle cx="54" cy="182" r="6" fill="#4a667d"/>
    <text x="70" y="190">取引の件数が</text>
    <text x="70" y="224">少ない</text>
    <circle cx="54" cy="302" r="6" fill="#4a667d"/>
    <text x="70" y="310">社長が数字を</text>
    <text x="70" y="344">つかめている</text>
    <circle cx="54" cy="422" r="6" fill="#4a667d"/>
    <text x="70" y="430">経理の時間が</text>
    <text x="70" y="464">負担でない</text>
    <rect x="312" y="80" width="264" height="424" rx="14" fill="#ffffff" stroke="#087fe5" stroke-width="3"/>
    <text x="444" y="124" font-size="26" font-weight="700" text-anchor="middle" fill="#087fe5">任せどきのサイン</text>
    <path d="M336 144 H552" stroke="#d8e7f2" stroke-width="2"/>
    <circle cx="342" cy="182" r="6" fill="#087fe5"/>
    <text x="358" y="190">本業の時間が</text>
    <text x="358" y="224">削られている</text>
    <circle cx="342" cy="302" r="6" fill="#087fe5"/>
    <text x="358" y="310">締めが遅れて</text>
    <text x="358" y="344">数字が見えない</text>
    <circle cx="342" cy="422" r="6" fill="#087fe5"/>
    <text x="358" y="430">やり方を知る</text>
    <text x="358" y="464">人が1人だけ</text>
  </g>
</svg>
