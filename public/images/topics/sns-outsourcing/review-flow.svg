<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" role="img" aria-labelledby="t">
  <title id="t">投稿前の確認の流れ（例）</title>
  <style>
    text { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #16334d; }
    .h { font-size: 30px; font-weight: 700; }
    .num { font-size: 26px; font-weight: 700; fill: #ffffff; }
    .tag { font-size: 24px; font-weight: 700; fill: #ffffff; }
    .bb { font-size: 26px; font-weight: 700; }
    .tx { font-size: 26px; fill: #4a667d; }
  </style>
  <rect width="600" height="610" fill="#fbfdff"/>
  <text class="h" x="300" y="50" text-anchor="middle">投稿前の確認の流れ（例）</text>

  <g fill="#ffffff" stroke="#d8e7f2" stroke-width="2">
    <rect x="20" y="80" width="560" height="96" rx="14"/>
    <rect x="20" y="196" width="560" height="96" rx="14"/>
    <rect x="20" y="312" width="560" height="96" rx="14"/>
  </g>
  <rect x="20" y="428" width="560" height="96" rx="14" fill="#eef6fc" stroke="#087fe5" stroke-width="3"/>
  <g fill="#087fe5">
    <polygon points="290,180 310,180 300,192"/>
    <polygon points="290,296 310,296 300,308"/>
    <polygon points="290,412 310,412 300,424"/>
  </g>

  <g fill="#16334d">
    <circle cx="60" cy="128" r="22"/>
    <circle cx="60" cy="244" r="22"/>
    <circle cx="60" cy="360" r="22"/>
    <circle cx="60" cy="476" r="22"/>
  </g>
  <text class="num" x="60" y="137" text-anchor="middle">1</text>
  <text class="num" x="60" y="253" text-anchor="middle">2</text>
  <text class="num" x="60" y="369" text-anchor="middle">3</text>
  <text class="num" x="60" y="485" text-anchor="middle">4</text>

  <rect x="98" y="109" width="96" height="38" rx="19" fill="#087fe5"/>
  <text class="tag" x="146" y="136" text-anchor="middle">外部</text>
  <rect x="98" y="225" width="96" height="38" rx="19" fill="#16334d"/>
  <text class="tag" x="146" y="252" text-anchor="middle">自社</text>
  <rect x="98" y="341" width="96" height="38" rx="19" fill="#087fe5"/>
  <text class="tag" x="146" y="368" text-anchor="middle">外部</text>
  <rect x="98" y="457" width="96" height="38" rx="19" fill="#4a667d"/>
  <text class="tag" x="146" y="484" text-anchor="middle">一緒に</text>

  <text class="bb" x="212" y="122">翌週分の案を作る</text>
  <text class="tx" x="212" y="158">文章と画像をセットで</text>
  <text class="bb" x="212" y="238">月曜にまとめて確認</text>
  <text class="tx" x="212" y="274">修正点はまとめて返す</text>
  <text class="bb" x="212" y="354">修正して予約投稿</text>
  <text class="tx" x="212" y="390">予定どおりに公開</text>
  <text class="bb" x="212" y="470">月1回 数字を振り返る</text>
  <text class="tx" x="212" y="506">次の月の内容を見直す</text>

  <rect x="20" y="544" width="560" height="50" rx="12" fill="#ffd85a"/>
  <text class="bb" x="300" y="579" text-anchor="middle">確認する人と期限を決める</text>
</svg>
