<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-labelledby="t">
  <title id="t">問い合わせまでに訪問者が確かめる3つの疑問</title>
  <style>
    text { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #16334d; }
    .h { font-size: 30px; font-weight: 700; }
    .q { font-size: 28px; font-weight: 700; }
    .a { font-size: 26px; fill: #4a667d; }
    .num { font-size: 28px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect width="600" height="640" fill="#fbfdff"/>
  <text class="h" x="300" y="50" text-anchor="middle">訪問者が確かめる3つの疑問</text>

  <rect x="20" y="80" width="560" height="130" rx="14" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <circle cx="64" cy="145" r="26" fill="#087fe5"/>
  <text class="num" x="64" y="155" text-anchor="middle">1</text>
  <text class="q" x="108" y="132">自分向けのサービスか</text>
  <text class="a" x="108" y="176">対象と悩みを具体的に書く</text>

  <polygon points="282,218 318,218 300,232" fill="#087fe5"/>

  <rect x="20" y="238" width="560" height="130" rx="14" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <circle cx="64" cy="303" r="26" fill="#087fe5"/>
  <text class="num" x="64" y="313" text-anchor="middle">2</text>
  <text class="q" x="108" y="290">何をしてくれるのか</text>
  <text class="a" x="108" y="334">サービスごとの内容と流れ</text>

  <polygon points="282,376 318,376 300,390" fill="#087fe5"/>

  <rect x="20" y="396" width="560" height="130" rx="14" fill="#ffffff" stroke="#d8e7f2" stroke-width="2"/>
  <circle cx="64" cy="461" r="26" fill="#087fe5"/>
  <text class="num" x="64" y="471" text-anchor="middle">3</text>
  <text class="q" x="108" y="448">次に何をすればよいか</text>
  <text class="a" x="108" y="492">目立つ問い合わせボタン</text>

  <polygon points="276,538 324,538 300,562" fill="#087fe5"/>
  <rect x="20" y="572" width="560" height="56" rx="14" fill="#16334d"/>
  <text x="300" y="610" text-anchor="middle" style="fill:#ffffff;font-size:26px;font-weight:700">3つに答えると問い合わせへ</text>
</svg>
