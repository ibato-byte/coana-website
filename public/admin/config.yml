backend:
  name: github
  repo: ibato-byte/coana-website
  branch: main
  base_url: https://api.netlify.com
  site_domain: coana-tokyo.netlify.app
  commit_messages:
    create: "{{collection}}「{{slug}}」を作成"
    update: "{{collection}}「{{slug}}」を更新"
    delete: "{{collection}}「{{slug}}」を削除"
    uploadMedia: "画像「{{path}}」をアップロード"
    deleteMedia: "画像「{{path}}」を削除"

locale: ja
site_url: https://coana.co.jp
display_url: https://coana.co.jp
media_folder: public/uploads
public_folder: /uploads
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: topics
    label: トピックス（お知らせ・実績・事例）
    label_singular: 記事
    folder: content/topics
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}{{month}}{{day}}-{{fields.slug}}"
    summary: "{{date | date('YYYY.MM.DD')}}｜{{category}}｜{{title}}"
    sortable_fields: [date, title, category]
    view_filters:
      - { label: お知らせ, field: category, pattern: お知らせ }
      - { label: サービス, field: category, pattern: サービス }
      - { label: イベント, field: category, pattern: イベント }
      - { label: 実績・事例, field: category, pattern: 実績・事例 }
      - { label: 下書き, field: draft, pattern: true }
    fields:
      - { label: タイトル, name: title, widget: string }
      - { label: URL用の英字名（例：new-service）, name: slug, widget: string, pattern: ["^[a-z0-9-]+$", "半角英小文字・数字・ハイフンのみ"] }
      - { label: 公開日, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY.MM.DD", time_format: false, hint: "未来の日付にすると予約投稿になります。その日の朝の自動更新（毎朝6時ごろ）で公開されます。" }
      - { label: カテゴリー, name: category, widget: select, options: [お知らせ, サービス, イベント, 実績・事例], default: お知らせ }
      - { label: 概要（SNS共有・検索結果の説明文に使用）, name: summary, widget: text, required: false }
      - { label: アイキャッチ画像, name: thumbnail, widget: image, required: false, hint: "記事一覧・記事ページ・SNS共有時に表示されます。横長（16:9）がおすすめです。新しくアップロードした画像は、公開するまでこの画面では壊れたアイコンで表示されますが、右上の「公開」を押すと約1〜2分でサイトに反映されます。" }
      - { label: 下書き（チェックすると非公開）, name: draft, widget: boolean, default: false, required: false }
      - { label: 本文, name: body, widget: markdown }

  - name: solutions
    label: サービス別ページ
    label_singular: サービス別ページ
    folder: content/solutions
    create: true
    extension: json
    format: json
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{order}}｜{{nav_label}}"
    sortable_fields: [order, nav_label]
    fields:
      - { label: URL（半角英小文字・数字・ハイフン。例：cloud-accounting → /services/cloud-accounting）, name: slug, widget: string, pattern: ['^[a-z0-9-]+$', '半角英小文字・数字・ハイフンで入力してください'] }
      - { label: 表示順, name: order, widget: number, value_type: int, default: 99 }
      - { label: 短い名前（一覧やリンクに表示）, name: nav_label, widget: string }
      - { label: 英語の小見出し, name: en, widget: string, required: false }
      - { label: ページの見出し, name: title, widget: string }
      - { label: 検索結果に出すタイトル, name: seo_title, widget: string, required: false, hint: "空欄の場合はページの見出しを使います" }
      - { label: 検索結果に出す説明文（120文字前後）, name: description, widget: text, required: false }
      - { label: ページ上部｜キャッチコピー（改行で2行まで。1行13文字以内が目安。下線を引く部分は **〜** で囲む（例：**問い合わせが届く**サイトへ。）。囲みがなければ最後の行に下線。空欄の場合はページの見出しを大きく表示）, name: catch, widget: text, required: false }
      - { label: リード文（60文字以内）, name: lead, widget: text }
      - { label: ページ上部｜動画（任意。設定するとイラストの代わりに表示。音なし・横長4:3推奨・10MB以内のmp4）, name: hero_video, widget: file, required: false }
      - { label: お悩みの見出し, name: problems_title, widget: string, required: false, default: こんなお悩みはありませんか }
      - { label: お悩み（4つ・各24文字以内）, name: problems, widget: list, field: { label: お悩み, name: problem, widget: string } }
      - { label: 支援内容の見出し, name: features_title, widget: string, required: false, default: 支援内容 }
      - { label: 支援内容のリード文, name: features_lead, widget: text, required: false }
      - label: 支援内容
        name: features
        widget: list
        summary: "{{fields.name}}"
        fields:
          - { label: 名称, name: name, widget: string }
          - { label: 説明, name: text, widget: text }
          - { label: アイコン, name: icon, widget: select, required: false, default: check, options: [check, search, tools, link, rules, calendar, handshake, doc, invoice, yen, chart, refresh, layout, cloud, target, megaphone, camera, shield, mail, mic, users, person, globe, rocket, building, store, clock, bank, sparkle] }
      - { label: 対応ツールの見出し, name: tools_title, widget: string, required: false, default: 対応ツールの例 }
      - { label: 対応ツール, name: tools, widget: list, required: false, field: { label: ツール名, name: tool, widget: string }, hint: "トップページ「対応ツール」に登録したツール名を含めると、ロゴが自動で表示されます（例：freee会計）。" }
      - { label: 流れの見出し, name: steps_title, widget: string, required: false, default: ご利用までの流れ }
      - label: ご利用までの流れ（5ステップ程度・説明は30文字以内）
        name: flow
        widget: list
        required: false
        summary: "{{fields.name}}"
        fields:
          - { label: ステップ名, name: name, widget: string }
          - { label: 説明, name: text, widget: text }
      - { label: 進め方の下の補足（期間の目安など）, name: flow_note, widget: string, required: false }
      - { label: 「お問い合わせ」帯の見出し, name: cta_title, widget: string, required: false, default: まずは、現状をお聞かせください。 }
      - { label: 「お問い合わせ」帯の本文（改行可）, name: cta_text, widget: text, required: false }
      - { label: ページの言語（英語ページの場合は en）, name: lang, widget: select, options: [ja, en], default: ja, required: false }
      - { label: 一覧・フッターに表示しない（英語ページなど）, name: hidden, widget: boolean, default: false, required: false }
      - { label: ページ上部｜ボタン下の一言, name: hero_note, widget: string, required: false }
      - label: ページ上部｜特徴タグ（3つ・数値ではなく事実を。語は8文字以内）
        name: hero_facts
        widget: list
        required: false
        summary: "{{fields.value}}"
        fields:
          - { label: 大きく表示する語, name: value, widget: string }
          - { label: 説明, name: label, widget: string }
      - { label: 対応ツールの補足, name: tools_note, widget: string, required: false }
      - label: 支援の仕組み（図解）
        name: scheme
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: 図の種類, name: type, widget: select, options: [{ label: 中心と周囲（ハブ型）, value: hub }, { label: 左から右の流れ（フロー型）, value: flow }], default: hub, required: false }
          - { label: 見出し, name: title, widget: string, required: false }
          - { label: リード文, name: lead, widget: text, required: false }
          - label: 中心（ハブ型のみ）
            name: center
            widget: object
            required: false
            fields:
              - { label: ラベル, name: label, widget: string, required: false, default: COANA TOKYO }
              - { label: 補足, name: sub, widget: string, required: false }
          - label: 周囲の要素／流れのステップ
            name: nodes
            widget: list
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: ラベル, name: label, widget: string }
              - { label: 補足1行目, name: sub, widget: string, required: false }
              - { label: アイコン（フロー型のみ）, name: icon, widget: string, required: false }
          - label: 図の下のポイント（3つ程度）
            name: points
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: 見出し, name: name, widget: string }
              - { label: 説明, name: text, widget: text }
              - { label: アイコン, name: icon, widget: string, required: false }
          - { label: 注記, name: note, widget: string, required: false }
      - label: ご依頼いただける業務の例
        name: scope
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: 見出し, name: title, widget: string, required: false }
          - label: 業務のグループ
            name: groups
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: グループ名（例：経理）, name: name, widget: string }
              - { label: アイコン, name: icon, widget: string, required: false }
              - { label: 業務の例, name: items, widget: list, field: { label: 業務, name: item, widget: string } }
          - { label: 注記（法令上お受けできない業務など）, name: note, widget: text, required: false }
      - label: ご利用プランの例
        name: plans
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: 見出し, name: title, widget: string, required: false }
          - label: プラン
            name: items
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: プラン名, name: name, widget: string }
              - { label: タグ（例：人気）, name: tag, widget: string, required: false }
              - { label: 説明, name: text, widget: text, required: false }
              - { label: 含まれる内容, name: includes, widget: list, required: false, field: { label: 内容, name: item, widget: string } }
              - { label: こんな方に, name: best_for, widget: string, required: false }
              - { label: おすすめとして強調する, name: featured, widget: boolean, default: false, required: false }
          - { label: 料金の注記, name: note, widget: text, required: false }
      - label: ご利用イメージ
        name: scenarios
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: 見出し, name: title, widget: string, required: false }
          - { label: リード文, name: lead, widget: text, required: false }
          - label: 例
            name: items
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: タグ（業種・規模など）, name: tag, widget: string, required: false }
              - { label: 見出し, name: name, widget: string }
              - { label: Before（支援前）, name: before, widget: text, required: false }
              - { label: After（支援後）, name: text, widget: text }
          - { label: 注記, name: note, widget: string, required: false }
      - label: 英語ページへの案内（創業支援など）
        name: english
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: 見出し, name: title, widget: string, required: false }
          - { label: 本文, name: text, widget: text, required: false }
          - { label: ボタンの文言, name: button, widget: string, required: false }
          - { label: リンク先ページのURL（例：startup-support-en）, name: slug, widget: string, required: false }
      - { label: よくある質問の見出し, name: faq_title, widget: string, required: false, default: よくあるご質問 }
      - label: よくある質問
        name: faqs
        widget: list
        required: false
        summary: "{{fields.q}}"
        fields:
          - { label: 質問, name: q, widget: string }
          - { label: 回答, name: a, widget: text }
      - label: 関連するコラム
        name: related
        widget: relation
        collection: topics
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
  - name: pages
    label: ページの文章
    editor:
      preview: false
    files:
      - name: home
        label: トップページ
        file: content/home.json
        fields:
          - { label: ヒーロー｜小見出し（英字）, name: hero_kicker, widget: string }
          - { label: ヒーロー｜キャッチコピー1行目, name: hero_line1, widget: string }
          - { label: ヒーロー｜キャッチコピー2行目, name: hero_line2, widget: string }
          - { label: ヒーロー｜切り替わるキーワード, name: hero_words, widget: list, field: { label: キーワード, name: word, widget: string } }
          - { label: ヒーロー｜キーワードに続く文, name: hero_solve_text, widget: string }
          - { label: ヒーロー｜説明文（60文字前後）, name: hero_lead, widget: text }
          - { label: ヒーロー｜ボタン下の小さなタグ（3つ）, name: hero_badges, widget: list, field: { label: タグ, name: badge, widget: string } }
          - { label: ヒーロー｜動画（任意。設定すると右側のイラストの代わりに表示。音なし・横長4:3推奨・10MB以内のmp4）, name: hero_video, widget: file, required: false }
          - { label: ヒーロー｜相談ボタンの文言, name: hero_button_primary, widget: string }
          - { label: ヒーロー｜サービスボタンの文言, name: hero_button_secondary, widget: string }
          - { label: サービス｜見出し, name: services_title, widget: string }
          - { label: サービス｜リード文, name: services_lead, widget: text }
          - { label: 支援スタイル｜見出し, name: strengths_title, widget: string, hint: "大きな一文は会社概要ページのメッセージ見出しを使います" }
          - label: 支援スタイル（4つ）
            name: strengths
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: 見出し, name: title, widget: string }
              - { label: 説明（30文字以内）, name: text, widget: string }
              - { label: アイコン, name: icon, widget: select, options: [{ label: 専門性, value: expertise }, { label: チーム, value: team }, { label: ワンストップ, value: one-stop }, { label: 柔軟性, value: flexible }] }
          - { label: 対応ツール｜見出し, name: tools_title, widget: string }
          - label: 対応ツール
            name: tools
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: ツール名, name: name, widget: string }
              - { label: ロゴ画像, name: logo, widget: image, required: false, hint: "各社のブランド規約で第三者の掲載が認められているロゴのみ設定してください（freee・マネーフォワード・Odoo は規約に沿って掲載可。Google・Microsoft・Slack・kintone などは事前承認が必要なため空欄＝文字表示）。" }
              - { label: カテゴリー, name: category, widget: string }
          - { label: 対応ツール｜一覧の下の補足, name: tools_note, widget: string, required: false }
          - { label: トピックス｜見出し, name: topics_title, widget: string }
          - { label: トピックス｜リード文, name: topics_lead, widget: text }
          - { label: よくあるご質問｜見出し, name: faq_title, widget: string }
          - label: よくあるご質問
            name: faqs
            widget: list
            summary: "{{fields.q}}"
            fields:
              - { label: 質問, name: q, widget: string }
              - { label: 回答, name: a, widget: text }
      - name: about
        label: 会社概要ページ
        file: content/about.json
        fields:
          - { label: ページ上部の画像, name: hero_image, widget: image, hint: "会社概要ページ（/about）の一番上、「会社概要」の文字の背景に薄く表示される画像です。新しくアップロードした画像は、公開するまでこの画面では壊れたアイコンで表示されますが、右上の「公開」を押すと約1〜2分でサイトに反映されます。" }
          - { label: 導入文, name: intro, widget: text, required: false }
          - { label: メッセージ見出し（改行可）, name: message_heading, widget: text }
          - { label: メッセージ本文（段落ごと）, name: message, widget: list, field: { label: 段落, name: p, widget: text } }
          - { label: 署名, name: signature, widget: string }
          - { label: 役職, name: profile_role, widget: string }
          - { label: 氏名, name: profile_name, widget: string }
          - { label: 氏名（英字）, name: profile_name_en, widget: string }
          - { label: プロフィール写真, name: profile_photo, widget: image, hint: "会社概要ページのプロフィールと、トップページの「Message」欄の代表写真です。縦長の写真がおすすめです。新しくアップロードした画像は、公開するまでこの画面では壊れたアイコンで表示されますが、右上の「公開」を押すと約1〜2分でサイトに反映されます。" }
          - { label: プロフィール（段落ごと）, name: profile, widget: list, field: { label: 段落, name: p, widget: text } }
          - label: 会社情報
            name: company
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: 項目名, name: label, widget: string }
              - { label: 内容（改行可）, name: value, widget: text }

      - name: services
        label: サービスページ
        file: content/services.json
        fields:
          - { label: ページ上部の画像, name: hero_image, widget: image, hint: "サービスページ（/services）の一番上、「サービス」の文字の背景に薄く表示される画像です。新しくアップロードした画像は、公開するまでこの画面では壊れたアイコンで表示されますが、右上の「公開」を押すと約1〜2分でサイトに反映されます。" }
          - { label: 導入文, name: intro, widget: text }
          - label: バックオフィス支援
            name: backoffice
            widget: object
            fields: &serviceFields
              - { label: 英字ラベル, name: en, widget: string }
              - { label: 名称, name: title, widget: string }
              - { label: 補足ラベル（例：守りを固める）, name: note, widget: string }
              - { label: リード文, name: lead, widget: text }
              - label: サービス項目
                name: items
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: 名称, name: name, widget: string }
                  - { label: 一言（カードに表示・25文字以内）, name: short, widget: string, required: false }
                  - { label: 説明（サービスページに表示・80文字以内）, name: text, widget: text }
                  - { label: タグ（例：実務代行にも対応）, name: tags, widget: list, required: false, field: { label: タグ, name: tag, widget: string } }
                  - { label: 専用ページ（選ぶと「詳しく見る」リンクが表示されます）, name: page, widget: relation, collection: solutions, value_field: slug, search_fields: [nav_label, title], display_fields: [nav_label], required: false }
          - label: マーケティング支援
            name: marketing
            widget: object
            fields: *serviceFields
          - { label: 料金｜見出し, name: pricing_title, widget: string }
          - { label: 料金｜本文, name: pricing, widget: text }
          - { label: ご利用までの流れ｜見出し, name: flow_title, widget: string }
          - { label: ご利用までの流れ｜ステップ, name: flow, widget: list, field: { label: ステップ, name: step, widget: string } }

      - name: privacy
        label: プライバシーポリシー
        file: content/privacy.json
        fields:
          - { label: 本文（空欄の場合は「掲載予定」と表示）, name: body, widget: markdown, required: false }

      - name: chat
        label: サポートチャット（メニュー・診断）
        file: content/chat.json
        fields:
          - { label: 名前（チャットの見出し）, name: name, widget: string }
          - { label: 名前の下の説明, name: subtitle, widget: string }
          - { label: 最初のあいさつ, name: greeting, widget: text }
          - { label: 注意書き（保存しない・個人情報）, name: note, widget: text }
          - { label: 無料相談の提案文（サイトにない条件は書かない）, name: consult_text, widget: text }
          - { label: 担当者へ引き継ぐときの文, name: handoff_text, widget: text }
          - { label: 関係のない質問への返答, name: offtopic_text, widget: text }
          - label: メニュー
            name: menu
            widget: list
            fields:
              - { label: ボタンの文言, name: label, widget: string }
              - { label: 案内するサービス（ページのslug。例：bookkeeping）, name: page, widget: string, required: false }
              - { label: あわせて案内するサービス（slug）, name: also, widget: list, required: false }
              - { label: 案内文（短く）, name: text, widget: text }
              - { label: 関連ページ（パス。例：/services）, name: links, widget: list, required: false }
          - label: あなたに合うサービス診断
            name: diagnosis
            widget: object
            fields:
              - { label: タイトル, name: title, widget: string }
              - { label: はじめの説明, name: intro, widget: text }
              - label: 質問（3〜5問）
                name: questions
                widget: list
                fields:
                  - { label: ID（英数字）, name: id, widget: string }
                  - { label: 短い名前（お問い合わせへの引き継ぎに使う）, name: short, widget: string }
                  - { label: 質問文, name: text, widget: string }
                  - label: 選択肢
                    name: options
                    widget: list
                    fields:
                      - { label: 選択肢の文言, name: label, widget: string }
                      - { label: 理由に引用する言い回し（任意）, name: phrase, widget: string, required: false }
                      - { label: 補足（任意。結果に添える）, name: note, widget: string, required: false }
                      - { label: 点数（サービスのslug と点数。例：bookkeeping 6）, name: scores, widget: object, required: false, fields: [ { label: 経理代行（bookkeeping）, name: bookkeeping, widget: number, required: false }, { label: バックオフィス代行・DX（backoffice-dx）, name: backoffice-dx, widget: number, required: false }, { label: クラウド会計（cloud-accounting）, name: cloud-accounting, widget: number, required: false }, { label: 創業支援（startup-support）, name: startup-support, widget: number, required: false }, { label: 創業支援・英語（startup-support-en）, name: startup-support-en, widget: number, required: false }, { label: 営業・販路開拓（sales-support）, name: sales-support, widget: number, required: false }, { label: Webサイト制作（web-production）, name: web-production, widget: number, required: false }, { label: SNS運用（sns-management）, name: sns-management, widget: number, required: false }, { label: セミナー・イベント（seminar-event）, name: seminar-event, widget: number, required: false } ] }
              - { label: おすすめの理由（サービスごと）, name: reasons, widget: object, fields: [ { label: 経理代行, name: bookkeeping, widget: text }, { label: バックオフィス代行・DX, name: backoffice-dx, widget: text }, { label: クラウド会計, name: cloud-accounting, widget: text }, { label: 創業支援, name: startup-support, widget: text }, { label: 創業支援（英語）, name: startup-support-en, widget: text }, { label: 営業・販路開拓, name: sales-support, widget: text }, { label: Webサイト制作, name: web-production, widget: text }, { label: SNS運用, name: sns-management, widget: text }, { label: セミナー・イベント, name: seminar-event, widget: text } ] }
              - label: 組み合わせの提案
                name: combos
                widget: list
                fields:
                  - { label: 2つのサービス（slug）, name: pair, widget: list }
                  - { label: 一言, name: text, widget: text }

      - name: settings
        label: 会社情報・共通設定
        file: content/settings.json
        fields:
          - { label: 会社名, name: company_name, widget: string }
          - { label: 公式LINEの友だち追加URL（空欄にするとLINEボタンを非表示）, name: line_url, widget: string, required: false, hint: "例：https://line.me/R/ti/p/@229ymxxk" }
          - { label: 日程予約ツールのURL（任意）, name: booking_url, widget: string, required: false, hint: "Googleカレンダーの予約スケジュールなどのURLを入れると、お問い合わせページとサポートチャットに「日程を予約する」ボタンが表示されます。空欄なら表示しません。" }
          - { label: ファビコン（ブラウザのタブに出るアイコン）, name: favicon, widget: image, hint: "正方形のSVGまたはPNG（32×32以上）をおすすめします。公開すると約1〜2分で反映されますが、ブラウザによっては古いアイコンがしばらく残ります。" }
          - { label: スマホホーム画面用アイコン, name: apple_touch_icon, widget: image, hint: "180×180のPNG。iPhoneでホーム画面に追加したときに表示されます。" }
          - { label: SNS共有時の画像（共通）, name: og_image, widget: image, hint: "XやFacebook、LINEでURLを共有したときに表示される画像です。1200×630のJPGまたはPNG。記事ページは各記事のアイキャッチが優先されます。" }
          - { label: 郵便番号, name: postal_code, widget: string }
          - { label: 住所, name: address, widget: string }
          - { label: メールアドレス, name: email, widget: string }
          - { label: フッターのキャッチコピー, name: footer_tagline, widget: string }
          - { label: コピーライト, name: copyright, widget: string }
          - label: お問い合わせ誘導エリア
            name: contact_band
            widget: object
            fields:
              - { label: 見出し, name: heading, widget: string }
              - { label: 本文（改行可）, name: text, widget: text }
          - { label: トピックス一覧ページ上部の画像, name: topics_hero_image, widget: image, hint: "トピックス一覧ページ（/topics）の一番上の背景に薄く表示される画像です。新しくアップロードした画像は、公開するまでこの画面では壊れたアイコンで表示されますが、右上の「公開」を押すと約1〜2分でサイトに反映されます。" }
          - { label: お問い合わせページの導入文, name: contact_intro, widget: text }
