# コラムの公開確認（オーナーへのメール）
# 「コラム公開待ち」ラベルの PR ができたら（または記事が更新されたら）、チェックの合格を待って、
# PR に「記事を読む」「公開する」「見送る」のリンク付きコメントを付ける。PR の作成者（オーナー）には
# GitHub から通知メールが届く（ibato@coana.co.jp）。ボタンの先は https://coana.co.jp/column-approval（functions/column-approval.ts）。
# 公開ボタンの署名には Secrets の COLUMN_APPROVAL_SECRET を使う（Cloudflare 側にも同じ値）。手順は docs/SEO_PLAYBOOK.md。
# Automation Hub（台帳 column-publish）：一時停止中は確認メールを送らない。最後に結果を記録する（HUB_TOKEN がなければ Hub は使わない）。
name: コラムの公開確認

# Actions の分を使い切らないため、チェックを待たない。チェックが終わるたび（check_suite／status）に起動し、まだなら何もせず終わる（依頼 #123）
on:
  pull_request:
    types: [opened, labeled, synchronize, reopened]
  check_suite:
    types: [completed]
  status:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR の番号（確認メールを出し直すとき）"
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

concurrency:
  group: column-approval-${{ github.event.pull_request.number || inputs.pr || github.event.check_suite.head_sha || github.event.sha }}
  cancel-in-progress: true

jobs:
  approval-mail:
    if: github.event_name != 'check_suite' || github.event.check_suite.app.slug != 'github-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      NO_WAIT: "1"
    steps:
      - name: 対象の PR を探す
        id: target
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) pr="${{ github.event.pull_request.number }}" ;;
            workflow_dispatch) pr="${{ inputs.pr }}" ;;
            check_suite) pr="${{ github.event.check_suite.pull_requests[0].number }}" ;;
            *) pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.sha }}/pulls" --jq '[.[] | select(.state=="open")][0].number // empty') ;;
          esac
          if [ -n "$pr" ] && gh pr view "$pr" -R "${{ github.repository }}" --json labels --jq '.labels[].name' | grep -qx 'コラム公開待ち'; then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "PR=$pr" >> "$GITHUB_OUTPUT"
          else echo "コラム公開待ちの対象ではない"; echo "go=false" >> "$GITHUB_OUTPUT"; fi
      # 署名する処理は、PR の中身ではなく main のものを使う
      - uses: actions/checkout@v4
        if: steps.target.outputs.go == 'true'
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: steps.target.outputs.go == 'true'
        with:
          node-version: 22
      - name: Automation Hub：一時停止の確認
        id: hub
        if: steps.target.outputs.go == 'true'
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          if [ -z "$HUB_TOKEN" ] || ! git clone -q --depth 1 "https://x-access-token:${HUB_TOKEN}@github.com/ibato-byte/automation-hub.git" "$RUNNER_TEMP/hub"; then
            echo "paused=false" >> "$GITHUB_OUTPUT"; echo "Automation Hub を使わずに続ける"; exit 0
          fi
          bash "$RUNNER_TEMP/hub/scripts/gha.sh" check column-publish
      - name: 確認コメント（メール）を送る
        if: steps.target.outputs.go == 'true' && steps.hub.outputs.paused != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COLUMN_APPROVAL_SECRET: ${{ secrets.COLUMN_APPROVAL_SECRET }}
          SELF_JOB: approval-mail
        run: node tools/column/approval-comment.mjs --pr ${{ steps.target.outputs.PR }}
      - name: Automation Hub に記録
        if: always() && steps.target.outputs.go == 'true'
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          PAUSED: ${{ steps.hub.outputs.paused }}
          PR: ${{ steps.target.outputs.PR }}
        run: |
          [ -d "$RUNNER_TEMP/hub" ] || exit 0
          bash "$RUNNER_TEMP/hub/scripts/gha.sh" report column-publish "$JOB_STATUS" "$PAUSED" "PR #${PR}：コラムの公開確認メール（公開・見送るボタン付き）を処理" --next-run-at none
