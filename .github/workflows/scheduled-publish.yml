# 予約投稿の自動公開
# 毎朝6時（日本時間）に content/topics を確認し、今日が公開日の記事があれば
# 公開用のコミットを main に入れて Cloudflare Pages のビルドを起動する。
# 公開日の記事がない日は何もしない（コミットも作らない）。
# Automation Hub（台帳 scheduled-publish）：最初に一時停止を確認し（停止中は何もしない）、最後に結果を記録する。Secrets の HUB_TOKEN がなければ Hub は使わない。
name: 予約投稿の公開

on:
  schedule:
    - cron: "0 21 * * *" # UTC 21:00 = 日本時間 6:00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Automation Hub：一時停止の確認
        id: hub
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          if [ -z "$HUB_TOKEN" ] || ! git clone -q --depth 1 "https://x-access-token:${HUB_TOKEN}@github.com/ibato-byte/automation-hub.git" "$RUNNER_TEMP/hub"; then
            echo "paused=false" >> "$GITHUB_OUTPUT"; echo "Automation Hub を使わずに続ける"; exit 0
          fi
          bash "$RUNNER_TEMP/hub/scripts/gha.sh" check scheduled-publish

      - name: 今日が公開日の記事を探す
        id: find
        if: steps.hub.outputs.paused != 'true'
        run: |
          today=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          titles=""
          for f in content/topics/*.md; do
            [ -f "$f" ] || continue
            head -n 20 "$f" | grep -Eq "^date:[[:space:]]*['\"]?${today}" || continue
            head -n 20 "$f" | grep -Eq "^draft:[[:space:]]*true" && continue
            t=$(head -n 20 "$f" | sed -n 's/^title:[[:space:]]*//p' | head -n 1)
            titles="${titles}${t} / "
          done
          echo "titles=${titles% / }" >> "$GITHUB_OUTPUT"
          if [ -n "$titles" ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

      - name: 公開用のコミットを入れてビルドを起動
        if: steps.find.outputs.found == 'true' && steps.hub.outputs.paused != 'true'
        env:
          TODAY: ${{ steps.find.outputs.today }}
          TITLES: ${{ steps.find.outputs.titles }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "予約投稿の公開（${TODAY}）: ${TITLES}"
          git push origin main

      - name: 公開日の記事なし
        if: steps.find.outputs.found != 'true' && steps.hub.outputs.paused != 'true'
        env:
          TODAY: ${{ steps.find.outputs.today }}
        run: echo "${TODAY} が公開日の記事はありません。"

      - name: Automation Hub に記録
        if: always()
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          PAUSED: ${{ steps.hub.outputs.paused }}
          TODAY: ${{ steps.find.outputs.today }}
          TITLES: ${{ steps.find.outputs.titles }}
        run: |
          [ -d "$RUNNER_TEMP/hub" ] || exit 0
          if [ -n "$TITLES" ]; then summary="${TODAY}：公開日の記事を公開（${TITLES}）。本番のビルドを起動"; published=1; else summary="${TODAY}：公開日の記事なし（何もしない日）"; published=0; fi
          bash "$RUNNER_TEMP/hub/scripts/gha.sh" report scheduled-publish "$JOB_STATUS" "$PAUSED" "$summary" \
            --next-run-at "$(bash "$RUNNER_TEMP/hub/scripts/gha.sh" next-daily 21:00)" --kpi "今日公開した記事=${published}"
