name: レンとジルの更新

# 公式ページ（/renjill）の一覧データ content/renjill/episodes.json を、公開リポジトリ renjill-media の episodes.json に合わせる。
# 変わったときだけ main に commit する（commit すると Cloudflare Pages が自動でデプロイする）。
on:
  schedule:
    - cron: "17 21 * * *" # 毎日 6:17 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency: renjill-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: 取得して形を確かめる
        run: |
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/ibato-byte/renjill-media/main/episodes.json" -o "$RUNNER_TEMP/episodes.json"
          node -e '
            const d = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/episodes.json", "utf8"));
            const bad = (m) => { console.error("形が違います: " + m); process.exit(1); };
            if (typeof d.updated !== "string" || typeof d.channels !== "object" || !Array.isArray(d.series) || !Array.isArray(d.episodes)) bad("トップの項目");
            for (const [k, u] of Object.entries(d.channels)) if (u !== null && !/^https:\/\//.test(u)) bad("channels." + k);
            for (const e of d.episodes) {
              if (!Number.isInteger(e.no) || !e.ep || !e.title || !/^\d{4}-\d{2}-\d{2}$/.test(e.date)) bad("episodes: " + JSON.stringify(e).slice(0, 80));
              if (e.youtube_id != null && !/^[\w-]{6,20}$/.test(e.youtube_id)) bad("youtube_id: " + e.ep);
            }
            const ids = new Set(d.series.map((s) => s.id));
            for (const e of d.episodes) if (e.series && !ids.has(e.series)) bad("series: " + e.ep);
          '
      - name: 変わっていたら commit
        run: |
          cp "$RUNNER_TEMP/episodes.json" content/renjill/episodes.json
          if git diff --quiet -- content/renjill/episodes.json; then echo "変更なし"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/renjill/episodes.json
          git commit -m "レンとジル：エピソード一覧を更新"
          git pull --rebase origin main
          git push origin main
